<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
@font-face{font-family:'AB';src:url('fonts/archivo-black-latin-400-normal.woff2')}
@font-face{font-family:'A9';src:url('fonts/archivo-latin-900-normal.woff2')}
@font-face{font-family:'ST';src:url('fonts/big-shoulders-stencil-display-latin-900-normal.woff2')}
html,body{margin:0;background:#FFD84D}
#capa{position:relative;width:1080px;height:1920px;background:#FFD84D;overflow:hidden;color:#111}
.hz{position:absolute;left:0;right:0;height:64px;background:repeating-linear-gradient(-45deg,#111 0 30px,#FFD84D 30px 60px)}
.num{position:absolute;left:50%;top:300px;transform:translateX(-50%);background:#111;color:#FFD84D;font-family:'ST';font-size:96px;line-height:1;padding:14px 40px 10px;border-radius:24px;letter-spacing:4px;white-space:nowrap}
.titulo{position:absolute;left:80px;right:80px;top:470px;height:520px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:'AB';font-size:124px;line-height:1.02;letter-spacing:-1px}
.titulo em{font-style:normal;background:#111;color:#FFD84D;padding:0 18px;border-radius:14px}
.visual{position:absolute;left:90px;right:90px;top:1030px;height:420px;background:#fff;border:16px solid #111;border-radius:48px;box-shadow:22px 22px 0 #111;display:flex;align-items:center;justify-content:center;gap:26px}
.cx{background:#fff;border:12px solid #111;border-radius:22px;padding:18px 34px;font-family:'AB';font-size:96px;display:flex;flex-direction:column;align-items:center;line-height:1}
.cx small{font-family:'A9';font-size:40px;color:#2F6BFF;margin-top:12px;letter-spacing:2px}
.selo{position:absolute;left:50%;top:1530px;transform:translateX(-50%);display:flex;align-items:center;gap:18px;background:#111;border-radius:26px;padding:14px 30px 14px 16px}
.selo .ic{width:90px;height:90px;background:#FFD84D;border-radius:18px;display:flex;align-items:center;justify-content:center}
.selo .nm{font-family:'ST';font-size:78px;color:#FFD84D;line-height:.9;letter-spacing:2px}
</style></head><body>
<div id="capa">
  <div class="hz" style="top:0"></div>
  <div class="num">Nº __NUM__</div>
  <div class="titulo"><div>__TITULO__</div></div>
  <div class="visual">__VISUAL__</div>
  <div class="selo"><div class="ic"><svg viewBox="0 0 220 200" width="78" height="71"><rect x="166" y="4" width="20" height="20" rx="4" fill="#fff" stroke="#111" stroke-width="7"/><rect x="150" y="30" width="15" height="15" rx="3" fill="#fff" stroke="#111" stroke-width="6"/><path d="M22 186 V78 L66 104 V78 L110 104 V78 L154 104 V56 H184 V186 Z" fill="#fff" stroke="#111" stroke-width="11" stroke-linejoin="round"/><text x="88" y="168" text-anchor="middle" font-family="AB" font-size="54" fill="#111">IA</text><rect x="6" y="182" width="208" height="12" rx="6" fill="#111"/></svg></div><div class="nm">FÁBRICA</div></div>
  <div class="hz" style="bottom:0"></div>
</div>
</body></html>
